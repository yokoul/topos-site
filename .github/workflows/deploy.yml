name: Build & deploy topos.red

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      CONFIGURED: ${{ secrets.ALWAYSDATA_HOST != '' && secrets.ALWAYSDATA_SSH_KEY != '' }}
    steps:
      - name: Secrets absents → pas de déploiement
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Déploiement ignoré — renseigner ALWAYSDATA_* dans l'environnement production."
      - uses: actions/download-artifact@v4
        if: env.CONFIGURED == 'true'
        with:
          name: dist
          path: dist/
      - name: Install SSH key
        if: env.CONFIGURED == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ALWAYSDATA_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.ALWAYSDATA_HOST }}" >> ~/.ssh/known_hosts
      - name: rsync to Alwaysdata
        if: env.CONFIGURED == 'true'
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.ALWAYSDATA_USER }}@${{ secrets.ALWAYSDATA_HOST }}:${{ secrets.ALWAYSDATA_PATH }}/"
