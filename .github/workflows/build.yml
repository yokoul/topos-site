name: Build topos.red

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Vérification de build uniquement. Le déploiement est pull-based sur always
# (ch.oul.topos-site tire main toutes les 5 min) — voir ops/README.md.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
